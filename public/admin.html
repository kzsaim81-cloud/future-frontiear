<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin – Future Frontier</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --neon:#00f0ff; --neon2:#7b5cfa; --dark:#050a14; --dark2:#0a1628;
    --text:#e8f4ff; --muted:#7a9abf; --accent:#f0c040; }
  body { font-family:'Exo 2',sans-serif; background:var(--dark); color:var(--text); min-height:100vh; padding:2rem; }
  h1 { font-family:'Orbitron',monospace; color:var(--neon); font-size:1.5rem; margin-bottom:0.4rem; }
  .subtitle { color:var(--muted); font-size:0.85rem; margin-bottom:2rem; }
  .login-box { max-width:360px; margin:6rem auto; background:rgba(10,22,40,0.8);
    border:1px solid rgba(0,240,255,0.2); border-radius:10px; padding:2.5rem; text-align:center; }
  .login-box h2 { font-family:'Orbitron',monospace; color:var(--neon); margin-bottom:1.5rem; font-size:1.1rem; }
  .login-box input { width:100%; background:rgba(255,255,255,0.05);
    border:1px solid rgba(0,240,255,0.2); color:var(--text); padding:0.75rem 1rem;
    border-radius:4px; font-family:'Exo 2',sans-serif; font-size:0.9rem; outline:none;
    margin-bottom:1rem; }
  .login-box input:focus { border-color:var(--neon); }
  .btn { background:linear-gradient(135deg,var(--neon),var(--neon2)); color:var(--dark);
    font-family:'Exo 2',sans-serif; font-weight:600; font-size:0.9rem;
    padding:0.75rem 2rem; border:none; border-radius:4px; cursor:pointer;
    letter-spacing:1px; width:100%; }
  .btn:hover { opacity:0.9; }
  .err { color:#ff6b6b; font-size:0.85rem; margin-top:0.8rem; }
  #dashboard { display:none; }
  .top-bar { display:flex; align-items:center; justify-content:space-between;
    margin-bottom:2rem; flex-wrap:wrap; gap:1rem; }
  .stats-row { display:flex; gap:1rem; flex-wrap:wrap; margin-bottom:2rem; }
  .stat-card { background:rgba(10,22,40,0.7); border:1px solid rgba(0,240,255,0.12);
    border-radius:8px; padding:1.2rem 1.8rem; min-width:140px; }
  .stat-card .num { font-family:'Orbitron',monospace; font-size:1.8rem; color:var(--neon); }
  .stat-card .lbl { font-size:0.75rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-top:0.2rem; }
  table { width:100%; border-collapse:collapse; background:rgba(10,22,40,0.6);
    border:1px solid rgba(0,240,255,0.1); border-radius:8px; overflow:hidden; }
  th { background:rgba(0,240,255,0.06); color:var(--neon); font-size:0.75rem;
    letter-spacing:2px; text-transform:uppercase; padding:0.9rem 1rem; text-align:left; }
  td { padding:0.85rem 1rem; font-size:0.88rem; border-top:1px solid rgba(255,255,255,0.04); color:var(--text); }
  tr:hover td { background:rgba(0,240,255,0.03); }
  .badge { display:inline-block; font-size:0.7rem; padding:0.2rem 0.6rem;
    border-radius:3px; border:1px solid; }
  .badge-neon { border-color:var(--neon); color:var(--neon); }
  .badge-purple { border-color:var(--neon2); color:var(--neon2); }
  .badge-gold { border-color:var(--accent); color:var(--accent); }
  .del-btn { background:none; border:1px solid rgba(255,80,80,0.3); color:#ff6b6b;
    font-size:0.75rem; padding:0.25rem 0.6rem; border-radius:3px; cursor:pointer; }
  .del-btn:hover { background:rgba(255,80,80,0.1); }
  .logout-btn { background:transparent; border:1px solid rgba(255,255,255,0.15);
    color:var(--muted); padding:0.45rem 1.2rem; border-radius:4px;
    cursor:pointer; font-family:'Exo 2',sans-serif; font-size:0.8rem; }
  .logout-btn:hover { border-color:var(--neon); color:var(--neon); }
  .refresh-btn { background:transparent; border:1px solid rgba(0,240,255,0.2);
    color:var(--neon); padding:0.45rem 1.2rem; border-radius:4px;
    cursor:pointer; font-family:'Exo 2',sans-serif; font-size:0.8rem; }
  .refresh-btn:hover { background:rgba(0,240,255,0.08); }
  .empty { text-align:center; color:var(--muted); padding:3rem; font-size:0.9rem; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginBox" class="login-box">
  <h2>🔐 Admin Login</h2>
  <input type="password" id="secretInput" placeholder="Admin password daalo..." onkeydown="if(event.key==='Enter') login()" />
  <button class="btn" onclick="login()">Login</button>
  <div class="err" id="loginErr"></div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="top-bar">
    <div>
      <h1>FUTURE FRONTIER</h1>
      <div class="subtitle">Admin Dashboard — Enrollments</div>
    </div>
    <div style="display:flex;gap:0.75rem;">
      <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>
  <div class="stats-row">
    <div class="stat-card"><div class="num" id="totalCount">0</div><div class="lbl">Total Enrollments</div></div>
    <div class="stat-card"><div class="num" id="todayCount">0</div><div class="lbl">Today</div></div>
    <div class="stat-card"><div class="num" id="courseCount">0</div><div class="lbl">Courses</div></div>
  </div>
  <table>
    <thead>
      <tr>
        <th>#</th><th>Name</th><th>Phone</th><th>Course</th><th>Date</th><th>Action</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
let secret = '';

function login() {
  secret = document.getElementById('secretInput').value.trim();
  if (!secret) { document.getElementById('loginErr').textContent = 'Password daalo.'; return; }
  loadData();
}

function logout() {
  secret = '';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('loginBox').style.display = 'block';
  document.getElementById('secretInput').value = '';
}

async function loadData() {
  try {
    const res = await fetch('/api/enrollments');
    const data = await res.json();
    if (!data.ok) { document.getElementById('loginErr').textContent = 'Wrong password!'; return; }

    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';

    const rows = data.enrollments;
    const today  = new Date().toISOString().slice(0, 10);
    const todayN = rows.filter(r => new Date(r.createdAt).toISOString().slice(0,10) === today).length;
    const courses = new Set(rows.map(r => r.course)).size;
    
    document.getElementById('totalCount').textContent = rows.length;
    document.getElementById('todayCount').textContent = todayN;
    document.getElementById('courseCount').textContent = courses;

    const tbody = document.getElementById('tableBody');
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty">Abhi tak koi enrollment nahi.</td></tr>';
      return;
    }
    tbody.innerHTML = rows.map((r, i) => `
      <tr>
        <td style="color:var(--muted)">${i + 1}</td>
        <td><strong>${r.name}</strong></td>
        <td><a href="tel:${r.phone}" style="color:var(--neon);text-decoration:none;">${r.phone}</a></td>
        <td><span class="badge badge-neon">${r.course}</span></td>
        <td style="color:var(--muted);font-size:0.8rem;">${new Date(r.createdAt).toLocaleDateString('en-PK')}</td>
        <td><button class="del-btn" onclick="deleteRow('${r.id}')">Delete</button></td>
      </tr>
    `).join('');
  } catch(e) {
    document.getElementById('loginErr').textContent = 'Server se connection fail. Server chal raha hai?';
  }
}

async function deleteRow(id) {
  if (!confirm('Is enrollment ko delete karo?')) return;
  await fetch(`/api/admin/enrollments/${id}?secret=${encodeURIComponent(secret)}`, { method:'DELETE' });
  loadData();
}
</script>
</body>
</html>
